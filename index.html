<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apocalypse 2029</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #080808;
    color: #eeeeee;
    font-family: Arial, Helvetica, sans-serif;
}

button {
    font-family: inherit;
}


/* =========================================================
   OPENING SCREEN
   ========================================================= */

#titleScreen {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #090909;
    text-align: center;
}

.title-box {
    width: 90%;
    max-width: 950px;
}

.game-title {
    margin: 0;
    font-size: 58px;
    letter-spacing: 12px;
    font-weight: 700;
    color: #f2f2f2;
}

.game-subtitle {
    margin-top: 17px;
    color: #777777;
    font-size: 12px;
    letter-spacing: 5px;
}

.red-line {
    width: 90px;
    height: 3px;
    background: #962929;
    margin: 40px auto;
}

.system-online {
    color: #a52d2d;
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 30px;
}

.welcome {
    color: #eeeeee;
    font-size: 27px;
    letter-spacing: 4px;
    margin-bottom: 42px;
}

.play-button {
    background: transparent;
    border: 1px solid #792222;
    color: #eeeeee;
    padding: 17px 70px;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 5px;
    cursor: pointer;
    transition: 0.2s;
}

.play-button:hover {
    background: #8e2727;
    border-color: #8e2727;
}


/* =========================================================
   MAIN INTERFACE
   ========================================================= */

#mainInterface {
    display: none;
    min-height: 100vh;
    background: #080808;
}


/* HEADER */

header {
    background: #151515;
    border-bottom: 3px solid #8e2727;
    padding: 38px 5%;
}

.header-title {
    font-size: 34px;
    letter-spacing: 8px;
    font-weight: bold;
    color: #eeeeee;
}

.header-subtitle {
    margin-top: 11px;
    color: #777777;
    font-size: 11px;
    letter-spacing: 4px;
}


/* =========================================================
   NAVIGATION
   ========================================================= */

nav {
    width: 100%;
    background: #101010;
    border-bottom: 1px solid #292929;
    padding: 0 5%;
    display: flex;
    align-items: stretch;
}

.nav-button {
    background: transparent;
    color: #a5a5a5;
    border: none;
    border-bottom: 3px solid transparent;
    padding: 21px 30px 18px;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1.7px;
    cursor: pointer;
    white-space: nowrap;
}

.nav-button:hover {
    color: #ffffff;
    background: #171717;
}

.nav-button.active {
    color: #ffffff;
    border-bottom-color: #a32c2c;
}


/* =========================================================
   CONTENT AREA
   ========================================================= */

main {
    width: 90%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 75px 0 110px;
}

.content-section {
    display: none;
}

.content-section.active {
    display: block;
}


/* Placeholder is temporary until real content is added */

.placeholder {
    min-height: 110px;
    display: flex;
    align-items: center;
    background: #111111;
    border: 1px solid #292929;
    border-left: 3px solid #922828;
    padding: 32px 38px;
    color: #777777;
    font-size: 14px;
    letter-spacing: 2px;
}


/* =========================================================
   FOOTER
   ========================================================= */

footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;

    background: #0e0e0e;
    border-top: 1px solid #242424;

    padding: 15px 5%;

    color: #555555;
    font-size: 10px;
    letter-spacing: 2px;
}

.return-title {
    background: none;
    border: none;
    color: #555555;
    padding: 0;
    font-size: 10px;
    letter-spacing: 2px;
    cursor: pointer;
}

.return-title:hover {
    color: #aaaaaa;
}

.footer-status {
    float: right;
    color: #9b2b2b;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 850px) {

    .game-title {
        font-size: 34px;
        letter-spacing: 6px;
    }

    .game-subtitle {
        letter-spacing: 3px;
    }

    header {
        padding: 25px 22px;
    }

    .header-title {
        font-size: 24px;
        letter-spacing: 4px;
    }

    nav {
        padding: 0 8px;
        overflow-x: auto;
    }

    .nav-button {
        padding: 18px 16px 15px;
        font-size: 10px;
    }

    main {
        width: auto;
        padding: 45px 22px 90px;
    }

    footer {
        padding: 14px 22px;
    }
}

</style>
</head>


<body>


<!-- ========================================================
     TITLE SCREEN
     ======================================================== -->

<section id="titleScreen">

    <div class="title-box">

        <h1 class="game-title">
            APOCALYPSE 2029
        </h1>

        <div class="game-subtitle">
            SURVIVAL ROLEPLAYING SYSTEM
        </div>

        <div class="red-line"></div>

        <div class="system-online">
            ● SYSTEM ONLINE
        </div>

        <div class="welcome">
            WELCOME, SURVIVOR.
        </div>

        <button class="play-button" onclick="enterGame()">
            PLAY
        </button>

    </div>

</section>



<!-- ========================================================
     MAIN GAME INTERFACE
     ======================================================== -->

<section id="mainInterface">


<header>

    <div class="header-title">
        APOCALYPSE 2029
    </div>

    <div class="header-subtitle">
        SURVIVAL ROLEPLAYING SYSTEM
    </div>

</header>



<nav>

    <button
        class="nav-button active"
        onclick="openSection('overview', this)">
        OVERVIEW
    </button>

    <button
        class="nav-button"
        onclick="openSection('rules', this)">
        RULES
    </button>

    <button
        class="nav-button"
        onclick="openSection('howtoplay', this)">
        HOW TO PLAY
    </button>

    <button
        class="nav-button"
        onclick="openSection('world', this)">
        CREATE / JOIN WORLD
    </button>

    <button
        class="nav-button"
        onclick="openSection('reference', this)">
        REFERENCE
    </button>

</nav>



<!-- ========================================================
     PAGE CONTENT

     IMPORTANT:
     Page names are NOT repeated here.
     The active navigation tab serves as the page title.
     ======================================================== -->

<main>


    <!-- OVERVIEW -->

    <section
        id="overview"
        class="content-section active">

        <div class="placeholder">
            CONTENT WILL APPEAR HERE
        </div>

    </section>



    <!-- RULES -->

    <section
        id="rules"
        class="content-section">

        <div class="placeholder">
            CONTENT WILL APPEAR HERE
        </div>

    </section>



    <!-- HOW TO PLAY -->

    <section
        id="howtoplay"
        class="content-section">

        <div class="placeholder">
            CONTENT WILL APPEAR HERE
        </div>

    </section>



    <!-- CREATE / JOIN WORLD -->

    <section
        id="world"
        class="content-section">

        <div class="placeholder">
            CONTENT WILL APPEAR HERE
        </div>

    </section>



    <!-- REFERENCE -->

    <section
        id="reference"
        class="content-section">

        <div class="placeholder">
            CONTENT WILL APPEAR HERE
        </div>

    </section>


</main>



<footer>

    <button
        class="return-title"
        onclick="returnToTitle()">
        ← TITLE SCREEN
    </button>

    <span class="footer-status">
        ● SYSTEM ONLINE
    </span>

</footer>


</section>



<script>

/* =========================================================
   PLAY
   ========================================================= */

async function enterGame() {

    /*
       Request fullscreen immediately after PLAY is clicked.
       Browsers require the user to initiate fullscreen,
       so PLAY is the ideal trigger.
    */

    try {

        const page = document.documentElement;

        if (page.requestFullscreen) {
            await page.requestFullscreen();
        }

        else if (page.webkitRequestFullscreen) {
            page.webkitRequestFullscreen();
        }

    }

    catch (error) {

        /*
           If fullscreen is blocked for any reason,
           the game still continues normally.
        */

        console.log("Fullscreen unavailable.");

    }


    document.getElementById("titleScreen").style.display = "none";

    document.getElementById("mainInterface").style.display = "block";

}


/* =========================================================
   RETURN TO TITLE SCREEN
   ========================================================= */

function returnToTitle() {

    document.getElementById("mainInterface").style.display = "none";

    document.getElementById("titleScreen").style.display = "flex";

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function openSection(sectionId, clickedButton) {

    const sections =
        document.querySelectorAll(".content-section");

    sections.forEach(function(section) {
        section.classList.remove("active");
    });


    const buttons =
        document.querySelectorAll(".nav-button");

    buttons.forEach(function(button) {
        button.classList.remove("active");
    });


    document
        .getElementById(sectionId)
        .classList.add("active");


    clickedButton.classList.add("active");

}

</script>


</body>
</html>
