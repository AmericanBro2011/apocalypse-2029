<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apocalypse 2029</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #0b0b0b;
        color: #e8e8e8;
        font-family: Arial, Helvetica, sans-serif;
    }

    /* TOP HEADER */

    header {
        background: #161616;
        border-bottom: 3px solid #8b1e1e;
        padding: 28px 45px 24px;
    }

    .title {
        margin: 0;
        font-size: 34px;
        letter-spacing: 7px;
        font-weight: 700;
        color: #f2f2f2;
    }

    .subtitle {
        margin-top: 7px;
        color: #777;
        font-size: 11px;
        letter-spacing: 3px;
    }

    /* NAVIGATION */

    nav {
        background: #111;
        border-bottom: 1px solid #292929;
        padding: 0 45px;
        display: flex;
        align-items: center;
        gap: 4px;
    }

    nav button {
        background: transparent;
        color: #aaa;
        border: none;
        border-bottom: 3px solid transparent;
        padding: 19px 22px 16px;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 1.5px;
        cursor: pointer;
    }

    nav button:hover {
        color: #fff;
        background: #181818;
    }

    nav button.active {
        color: #fff;
        border-bottom-color: #a32626;
    }

    /* PAGE BODY */

    main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 65px 45px;
    }

    .section-label {
        color: #9b2727;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 3px;
        margin-bottom: 14px;
    }

    h1 {
        margin: 0;
        font-size: 38px;
        letter-spacing: 2px;
        font-weight: 600;
    }

    .line {
        width: 55px;
        height: 3px;
        background: #8b1e1e;
        margin-top: 24px;
    }

    .placeholder {
        margin-top: 45px;
        background: #131313;
        border: 1px solid #292929;
        border-left: 3px solid #8b1e1e;
        padding: 28px;
        color: #777;
        letter-spacing: 1px;
    }

    /* FOOTER */

    footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #0e0e0e;
        border-top: 1px solid #222;
        padding: 13px 45px;
        color: #555;
        font-size: 10px;
        letter-spacing: 2px;
    }

    .status {
        color: #9b2727;
        float: right;
    }

    /* MOBILE */

    @media (max-width: 800px) {
        header {
            padding: 22px;
        }

        .title {
            font-size: 25px;
            letter-spacing: 4px;
        }

        nav {
            padding: 0 10px;
            overflow-x: auto;
        }

        nav button {
            white-space: nowrap;
            padding: 17px 14px 14px;
            font-size: 10px;
        }

        main {
            padding: 45px 22px;
        }

        footer {
            padding: 12px 22px;
        }
    }
</style>
</head>

<body>

<header>
    <div class="title">APOCALYPSE 2029</div>
    <div class="subtitle">SURVIVAL ROLEPLAYING SYSTEM</div>
</header>

<nav>
    <button class="active">OVERVIEW</button>
    <button>RULES</button>
    <button>HOW TO PLAY</button>
    <button>CREATE / JOIN WORLD</button>
    <button>REFERENCE</button>
</nav>

<main>
    <div class="section-label">APOCALYPSE 2029</div>
    <h1>OVERVIEW</h1>
    <div class="line"></div>

    <div class="placeholder">
        CONTENT WILL APPEAR HERE
    </div>
</main>

<footer>
    APOCALYPSE 2029
    <span class="status">● SYSTEM ONLINE</span>
</footer>

</body>
</html>
